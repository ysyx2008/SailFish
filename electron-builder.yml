# ⚠️ [高风险配置] 应用标识符
# 如果 macOS 打包后 SSH 连接失败，尝试改回旧值排查
# 安全回退值：appId: com.qiyu.terminal, productName: 旗鱼
appId: com.sfterm.terminal
productName: SailFish
protocols:
  - name: "SailFish Protocol"
    schemes:
      - sailfish
# ⚠️ [高风险配置] macOS 本地化应用名称修复钩子
# 如果 macOS 打包后 SSH 连接失败，请先删除此行排查
# 安全回退值：删除整行 afterPack
afterPack: ./scripts/afterPack.js
directories:
  buildResources: resources
  output: release
# 自动更新配置
publish:
  provider: github
  owner: ysyx2008
  repo: SailFish
# 构建加速配置
electronDownload:
  cache: ./electron-cache
buildDependenciesFromSource: false
nodeGypRebuild: false
files:
  - dist
  - dist-electron
asarUnpack:
  # node-pty / keytar 是原生模块（含 .node），必须解包到 asar 外，
  # 否则打包后 require 失败导致后端初始化中止（历史/对话/语音全部不可用）。
  # 依赖已从 @homebridge/node-pty-prebuilt-multiarch 换为 node-pty，勿再写旧包名。
  - node_modules/node-pty/**/*
  - node_modules/keytar/**/*
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-darwin-*/**/*
  - node_modules/sherpa-onnx-linux-*/**/*
  - node_modules/sherpa-onnx-win-*/**/*
  - node_modules/onnxruntime-node/**/*
  - "**/onnxruntime-node/**/*"
  # 原生 ORT 加载失败时 worker 改走 WASM（Server / 无独显）
  - node_modules/onnxruntime-web/**/*
  - node_modules/guid-typescript/**/*
  - node_modules/long/**/*
  - node_modules/platform/**/*
  - node_modules/protobufjs/**/*
  - node_modules/@protobufjs/**/*
  # utilityProcess worker 用 ESM import，NODE_PATH 无效；传递依赖必须物理在 asar.unpacked
  # （unpacked 包无法再解析仍在 asar 内的依赖——经典 asarUnpack 缺口）
  - node_modules/onnxruntime-common/**/*
  - node_modules/apache-arrow/**/*
  - node_modules/@huggingface/jinja/**/*
  - node_modules/@huggingface/tokenizers/**/*
  # transformers → sharp 运行时依赖（11.4.1 漏解包，导致 Embedding worker 初始化失败）
  - node_modules/detect-libc/**/*
  - node_modules/@img/colour/**/*
  - node_modules/semver/**/*
  # lancedb-worker → @lancedb/lancedb 唯一 JS 依赖
  - node_modules/reflect-metadata/**/*
  # apache-arrow 运行时（lancedb → arrow；26 日日志已确认缺 tslib）
  - node_modules/tslib/**/*
  - node_modules/flatbuffers/**/*
  - dist-electron/services/speech/**/*
  - dist-electron/services/pdf-worker.js
  - dist-electron/services/pdfjs-config.mjs
  - dist-electron/services/pdf-text-extract.mjs
  - dist-electron/services/knowledge/**/*
  - node_modules/@huggingface/transformers/**/*
  # LanceDB 原生 Rust addon（lancedb-worker.js 在 utilityProcess 中 require，必须在 asar 外）
  - node_modules/@lancedb/lancedb/**/*
  - node_modules/@lancedb/lancedb-darwin-*/**/*
  - node_modules/@lancedb/lancedb-linux-*/**/*
  - node_modules/@lancedb/lancedb-win32-*/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-*/**/*
  - node_modules/@firecrawl/pdf-inspector/**/*
  - node_modules/@firecrawl/pdf-inspector-*/**/*
  # sharp 是 native 模块，运行时按平台动态 require
  # build/Release/sharp-{platform}-{arch}.node，必须保留在文件系统而不是 asar 内
  - node_modules/sharp/**/*
  - node_modules/@img/sharp-*/**/*
# 启用最大压缩率以减小安装包大小（会增加打包时间）
# compression: maximum
extraResources:
  # 系统托盘图标（运行时加载）
  - from: "resources/icon_trayTemplate.png"
    to: "icon_trayTemplate.png"
  - from: "resources/icon_trayTemplate@2x.png"
    to: "icon_trayTemplate@2x.png"
  - from: "resources/icon.png"
    to: "icon.png"
  # IM 平台配置指南（供 Agent 读取）
  - from: "docs/messaging"
    to: "docs/messaging"
    filter:
      - "**/*.md"
  # 轻量 Embedding 模型（随软件打包）
  - from: "resources/models/embedding/bge-small-zh-v1.5"
    to: "models/embedding/bge-small-zh-v1.5"
    filter:
      - "**/*"
  # 语音 ASR/标点模型改为按需安装（见 electron/services/speech/SPEC.md），不再打进安装包
  # 浏览器助手扩展与 Native Host
  - from: "resources/browser-bridge"
    to: "browser-bridge"
    filter:
      - "**/*"
  # Chart 技能内置地图 GeoJSON
  - from: "resources/chart-maps"
    to: "chart-maps"
    filter:
      - "**/*"
  # 编程技能的搜索程序（scripts/download-ripgrep.js 按目标架构备好；mac universal 时两份同路径会被合成一份）
  - from: "resources/ripgrep/${os}-${arch}"
    to: "ripgrep"
    filter:
      - "rg"
      - "rg.exe"
      - "LICENSE-MIT"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Everything 便携版（仅 Windows）- 用于快速文件搜索
  extraResources:
    - from: "resources/everything"
      to: "everything"
      filter:
        - "**/*.exe"
        - "**/*.dll"
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 旗鱼
  include: resources/nsis/vcredist-install.nsh
  # 多语言安装程序
  installerLanguages:
    - en_US
    - zh_CN
  language: 2052
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # zip 文件是自动更新必需的（Squirrel.Mac 需要 zip 而非 dmg）
#    - target: zip
#      arch:
#        - x64
#        - arm64
  # ⚠️ [高风险配置] 本地化应用名称支持
  # 如果 macOS 打包后 SSH 连接失败，请删除下方 extraFiles 和 extendInfo 整块配置
  # 安全回退：只保留上面的 icon 和 target
  extraFiles:
    - from: "resources/zh-Hans.lproj"
      to: "Resources/zh-Hans.lproj"
    - from: "resources/en.lproj"
      to: "Resources/en.lproj"
  extendInfo:
    # 不设置 CFBundleDisplayName，让系统从 InfoPlist.strings 读取本地化名称
    CFBundleDevelopmentRegion: en
    LSHasLocalizedDisplayName: true
    CFBundleLocalizations:
      - en
      - zh_CN
      - zh-Hans
    # ⚠️ 勿删：macOS 14+ 本地网络访问授权说明（SSH/SFTP 连局域网/VM 必需）
    # 缺失会导致静默拒绝本地网络访问且不弹授权弹窗，表现为 EHOSTUNREACH；
    # 系统设置「本地网络」也无手动添加应用的入口，只能靠 plist + 运行时探测触发。
    NSLocalNetworkUsageDescription: "SailFish 需要访问本地网络以连接 SSH/SFTP 服务器、虚拟机及局域网设备。"
    # ⚠️ 勿删：声明 Bonjour 服务类型（客户端不会真正发布；仅配合 mDNS 探测触发本地网络授权）
    # 与 electron/utils/local-network-permission.ts、main 启动探测配套，缺一不可。
    NSBonjourServices:
      - _ssh._tcp
      - _sftp-ssh._tcp
    # 麦克风访问授权说明（语音识别 / 语音输入功能必需）
    # macOS TCC 在首次调用 getUserMedia 时会读取此 key 作为弹窗文案；
    # 缺失会被系统静默拒绝授权。
    NSMicrophoneUsageDescription: "SailFish 需要访问麦克风以提供语音输入和语音识别功能。"
dmg:
  # DMG 窗口配置
  window:
    width: 660
    height: 500
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications
    - x: 230
      y: 370
      type: file
      path: resources/dmg/Installation Guide.txt
    - x: 430
      y: 370
      type: file
      path: resources/dmg/安装说明.txt
linux: false
