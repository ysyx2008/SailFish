name: Build Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发（如 v1.0.0）
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号（可选，不填则使用 package.json 中的版本）'
        required: false
        type: string

# 确保同时只有一个构建任务运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 全局权限设置 - 允许创建 Release 和上传资源
permissions:
  contents: write

jobs:
  # Windows 构建
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: resources/models
          key: models-${{ hashFiles('scripts/download-models.js', 'scripts/download-embedding-model.js', 'scripts/download-speech-model.js', 'scripts/download-punct-model.js') }}
          restore-keys: models-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:win
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"  # vite build 内存密集，默认堆约 2GB 不够用

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  # macOS 构建
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: resources/models
          key: models-${{ hashFiles('scripts/download-models.js', 'scripts/download-embedding-model.js', 'scripts/download-speech-model.js', 'scripts/download-punct-model.js') }}
          restore-keys: models-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:mac
        # fix-mac-yml.js 会在本地修复 latest-mac.yml 添加 arch 字段
        # 不要设置 npm_config_electron_mirror / ELECTRON_MIRROR：
        # @electron/get 的 mirrorVar 会让该 env 优先级压过 electron-builder
        # 内部传给 dmg-builder 的 mirrorOptions.mirror，导致 dmg-builder 二进制
        # 也被错误地拼接到 electron/electron repo 路径下 → 404
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"  # vite build 内存密集，默认堆约 2GB 不够用
          # 如果需要代码签名，取消注释以下配置
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  # 创建 GitHub Release 并上传构建产物
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release-meta.json
        run: node scripts/generate-release-meta.js ${GITHUB_REF#refs/tags/v} release-meta.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: 旗鱼 ${{ steps.get_version.outputs.VERSION }}
          draft: false  # 不作为草稿，直接发布
          generate_release_notes: true
          body: |
            ## 安装说明

            ### Windows
            下载 `.exe` 文件，双击安装即可。如安装程序无法运行（如 Windows Server 2016），可下载 `.zip` 免安装包，解压后直接运行。

            ### macOS
            下载 `.dmg` 文件，打开后将应用拖入 Applications 文件夹。

            ⚠️ **首次运行提示"已损坏"的解决方法：**

            由于应用未进行 Apple 签名，macOS 可能会阻止运行。请打开终端执行：
            ```bash
            xattr -cr /Applications/SailFish.app
            ```
            然后重新打开应用即可。

            ---

          files: |
            release-meta.json
            artifacts/windows-release/*
            artifacts/macos-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 上传到阿里云 OSS（国内加速下载）
  upload-oss:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release-meta.json
        run: node scripts/generate-release-meta.js ${{ steps.get_version.outputs.VERSION }} release-meta.json

      - name: Setup aliyun ossutil
        run: |
          curl -o ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -j ossutil64 -d /tmp/ossutil
          chmod +x /tmp/ossutil/ossutil64
          /tmp/ossutil/ossutil64 config -e oss-cn-wuhan-lr.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Upload to OSS
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          OSSUTIL=/tmp/ossutil/ossutil64
          BUCKET=oss://sfterm-download
          WIN=artifacts/windows-release
          MAC=artifacts/macos-release
          
          # 官网下载用（固定文件名，不带版本号）
          # Windows
          $OSSUTIL cp ${WIN}/SailFish-Setup-${VERSION}.exe ${BUCKET}/SailFish-Setup.exe -f
          if [ -f "${WIN}/SailFish-${VERSION}-x64.zip" ]; then
            $OSSUTIL cp "${WIN}/SailFish-${VERSION}-x64.zip" ${BUCKET}/SailFish-x64.zip -f
          fi
          # macOS
          $OSSUTIL cp ${MAC}/SailFish-${VERSION}-arm64.dmg ${BUCKET}/SailFish-arm64.dmg -f
          $OSSUTIL cp ${MAC}/SailFish-${VERSION}.dmg ${BUCKET}/SailFish-x64.dmg -f
          
          # electron-updater 自动更新用（版本化文件 + 元数据 yml）
          # Windows
          $OSSUTIL cp ${WIN}/latest.yml ${BUCKET}/releases/latest.yml -f
          $OSSUTIL cp ${WIN}/SailFish-Setup-${VERSION}.exe ${BUCKET}/releases/SailFish-Setup-${VERSION}.exe -f
          $OSSUTIL cp ${WIN}/SailFish-Setup-${VERSION}.exe.blockmap ${BUCKET}/releases/SailFish-Setup-${VERSION}.exe.blockmap -f
          if [ -f "${WIN}/SailFish-${VERSION}-x64.zip" ]; then
            $OSSUTIL cp "${WIN}/SailFish-${VERSION}-x64.zip" ${BUCKET}/releases/SailFish-${VERSION}-x64.zip -f
          fi
          # macOS
          if [ -f ${MAC}/latest-mac.yml ]; then
            $OSSUTIL cp ${MAC}/latest-mac.yml ${BUCKET}/releases/latest-mac.yml -f
            for f in ${MAC}/SailFish-${VERSION}*.dmg; do
              [ -f "$f" ] && $OSSUTIL cp "$f" ${BUCKET}/releases/$(basename "$f") -f
            done
            for f in ${MAC}/SailFish-${VERSION}*.zip; do
              [ -f "$f" ] && $OSSUTIL cp "$f" ${BUCKET}/releases/$(basename "$f") -f
            done
            for f in ${MAC}/*.blockmap; do
              [ -f "$f" ] && $OSSUTIL cp "$f" ${BUCKET}/releases/$(basename "$f") -f
            done
          fi

          # 更新弹窗版本摘要
          $OSSUTIL cp release-meta.json ${BUCKET}/releases/release-meta.json -f

          # 差分更新布局见 docs/auto-update-oss.md
          chmod +x scripts/clean-oss-old-installers.sh
          OSSUTIL=$OSSUTIL BUCKET=$BUCKET ./scripts/clean-oss-old-installers.sh "$VERSION"
          
          echo "✅ All files uploaded to OSS successfully!"

  # Release 发布后触发 Cloudflare Pages 重新构建官网（确保版本号更新）
  trigger-cloudflare:
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: |
          curl -s -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
          echo "✅ Cloudflare Pages deploy triggered!"
