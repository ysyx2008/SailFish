name: Steam Build

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for Steam (Windows)
        run: npm run build:steam:win
        env:
          VITE_STEAM_BUILD: 'true'
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: steam-windows
          path: release/win-unpacked/
          retention-days: 3

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for Steam (macOS)
        run: npm run build:steam:mac
        env:
          VITE_STEAM_BUILD: 'true'
      
      - name: List macOS build output
        run: ls -la release/
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: steam-macos
          path: release/mac-universal/
          retention-days: 3
